<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Estruturas de Dados — AED</title>
    <!-- Ícone embutido: três nós ligados, legível no tamanho de uma aba. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Crect x='5' y='13' width='7' height='7' rx='1.5' fill='%2334d399'/%3E%3Crect x='20' y='13' width='7' height='7' rx='1.5' fill='%23818cf8'/%3E%3Cpath d='M13 16.5h6' stroke='%2394a3b8' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- Ícone raster para a tela de início de iOS/Android, que não aceita SVG. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Simulador visual passo a passo de pilha, fila e lista ligada para a disciplina de Algoritmos e Estruturas de Dados."
    />

    <!--
      Cartão de compartilhamento. O link do simulador circula em grupo de turma e
      no Classroom, onde sem estas marcações aparece como texto cru. As URLs de
      imagem precisam ser absolutas: quem monta a prévia é um servidor externo,
      que não tem como resolver caminho relativo.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Simulador de Estruturas de Dados" />
    <meta property="og:title" content="Simulador de Estruturas de Dados — AED" />
    <meta
      property="og:description"
      content="Pilha, fila e lista ligada passo a passo: cada operação decomposta em passos, com pseudocódigo sincronizado e complexidade Big-O."
    />
    <meta property="og:url" content="https://simulador-de-estrutura-de-dados.vercel.app/" />
    <meta
      property="og:image"
      content="https://simulador-de-estrutura-de-dados.vercel.app/og.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Título do simulador sobre fundo escuro, acima de um diagrama de quatro nós ligados por setas terminando em NULL."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
